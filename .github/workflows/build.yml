name: Build exe
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mss numpy opencv-python pynput pyinstaller
      - run: pyinstaller --onefile --noconsole --name AutoFish auto_fish.py
      - uses: actions/upload-artifact@v4
        with:
          name: AutoFish
          path: dist/AutoFish.exe
